name: One-shot prix carburant personnalise

on:
  push:
    branches:
      - feature/prix-carburant-personnalise
    paths:
      - .github/workflows/oneshot-prix-carburant-personnalise.yml
      - .github/patch_prix_carburant.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/prix-carburant-personnalise
      - name: Patch index.html
        run: python .github/patch_prix_carburant.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Ajoute un prix de carburant personnalise"
          git push
