name: One-shot fix bloc carburant desktop

on:
  push:
    branches:
      - fix/align-prix-perso-desktop
    paths:
      - .github/workflows/oneshot-fix-carburant-ouvert.yml
      - .github/patch_fix_carburant_ouvert.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/align-prix-perso-desktop
      - name: Corrige le bloc carburant desktop
        run: python .github/patch_fix_carburant_ouvert.py
      - name: Commit
        run: |
          if git diff --quiet -- index.html; then
            echo "Aucun changement"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Corrige définitivement le bloc carburant desktop"
          git push
