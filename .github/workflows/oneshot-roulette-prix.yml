name: One-shot roulette prix identique conso

on:
  push:
    branches:
      - feature/prix-carburant-personnalise
    paths:
      - .github/workflows/oneshot-roulette-prix.yml
      - .github/patch_roulette_prix.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/prix-carburant-personnalise
      - name: Aligne la roulette prix sur celle de la consommation
        run: python .github/patch_roulette_prix.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Aucun changement"
          else
            git commit -m "Aligne la roulette du prix sur celle de la consommation"
            git push
          fi
