name: One-shot remonte prix moyen

on:
  push:
    branches:
      - feature/prix-carburant-personnalise
    paths:
      - .github/workflows/oneshot-remonte-prix-moyen.yml
      - .github/patch_remonte_prix.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/prix-carburant-personnalise
      - name: Patch index.html
        run: python .github/patch_remonte_prix.py
      - name: Commit changes
        run: |
          if git diff --quiet -- index.html; then
            echo "Aucun changement"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Replace le prix moyen au-dessus de l'option personnalisée"
          git push