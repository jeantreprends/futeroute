name: Générer les pages trajet (SEO)

# Déclenchement manuel, ou automatique chaque matin (rafraîchit les prix
# carburant/péages des pages statiques trajets/*.html — le site principal, lui,
# recalcule déjà tout en temps réel à chaque visite).
# Publication directe sur main (pas de PR) : ces pages sont des instantanés SEO
# datés, sans enjeu critique. Un garde-fou dans le générateur abandonne sans
# rien écrire si trop de trajets échouent (API en panne), donc pas de risque de
# publier une liste/sitemap amputés.
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - '.github/workflows/generate-trajets.yml'
      - 'scripts/generate-trajets.js'
  schedule:
    - cron: '0 6 * * *'

concurrency:
  group: generate-trajets-seo
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Installe les dépendances (Playwright)
        run: npm ci

      - name: Installe Chromium pour Playwright
        run: npx playwright install --with-deps chromium

      - name: Génère et publie les pages trajet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          ref="refs/heads/$GITHUB_REF_NAME"

          for tentative in 1 2 3; do
            git fetch --no-tags origin "$ref"
            base=$(git rev-parse FETCH_HEAD)
            if ! git diff --quiet HEAD "$base" -- package.json package-lock.json; then
              git switch --detach "$base"
              npm ci
              npx playwright install --with-deps chromium
            else
              git switch --detach "$base"
            fi
            npm run generate:trajets
            git add trajets sitemap.xml
            if git diff --cached --quiet; then
              echo "Les pages sont à jour."
              exit 0
            fi
            git commit -m "Régénère les pages trajet (chiffres à jour)"
            if git push origin "HEAD:$ref"; then
              exit 0
            fi
            git fetch --no-tags origin "$ref"
            if [ "$(git rev-parse FETCH_HEAD)" = "$base" ]; then
              echo "::error::Publication refusée alors que la branche distante est inchangée."
              exit 1
            fi
            echo "La branche a changé pendant le calcul (tentative $tentative/3)."
          done
          echo "::error::La branche a changé pendant chacune des trois tentatives."
          exit 1
